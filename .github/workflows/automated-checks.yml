name: Automated checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Python bugs and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install analysis tools
        id: tools
        run: python -m pip install ruff==0.16.7 bandit==1.9.4
      - name: Check syntax and likely Python bugs
        run: python -m ruff check --select E9,F63,F7,F82 --output-format github .
      - name: Check high-confidence, high-severity security issues
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python -m bandit -r . --exclude .venv,venv --severity-level high --confidence-level high
